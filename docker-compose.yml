version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: padel_db
    restart: always
    environment:
      POSTGRES_DB: padel_db
      POSTGRES_USER: padel_user
      POSTGRES_PASSWORD: padel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: