server.port=8080

# Conexión a la base de datos levantada con Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/padel_db
spring.datasource.username=padel_user
spring.datasource.password=padel_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: actualiza el esquema automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect